<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarScout - Find Funded Academic Opportunities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans text-gray-800">

    <!-- Navigation -->
    <nav class="bg-blue-900 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-baseline space-x-2">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
                <h1 class="text-2xl font-bold tracking-wide">ScholarScout</h1>
                <span class="text-xs text-blue-300 font-mono bg-blue-800 px-2 py-0.5 rounded">v2.0.0</span>
            </div>
            <p class="hidden sm:block text-sm text-blue-200">Your portal to fully funded academic positions</p>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto w-full p-4 sm:p-6 lg:p-8">
        
        <!-- Search Form -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8 border border-gray-100">
            <h2 class="text-xl font-semibold mb-4 text-blue-900 border-b pb-2"><i class="fa-solid fa-magnifying-glass mr-2"></i>Search Opportunities</h2>
            <form id="searchForm" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Area of Interest (Up to 5 Keywords)</label>
                        <input type="text" id="keywords" required placeholder="e.g., Machine Learning, Climate Change, Biology" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Position Level</label>
                        <select id="level" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="Masters">Masters (Fully Funded)</option>
                            <option value="PhD">PhD (Fully Funded)</option>
                            <option value="Postdoc">Postdoc Fellowship</option>
                            <option value="Academic Position">Academic / Faculty Position</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Expected Country or Region</label>
                        <input type="text" id="location" required placeholder="e.g., Europe, Canada, USA, Japan, Anywhere" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Expected Starting Date</label>
                        <div class="flex items-center space-x-3">
                            <input type="date" id="startDate" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                            <label class="flex items-center space-x-2 text-sm whitespace-nowrap bg-gray-100 px-3 py-2 rounded-md cursor-pointer">
                                <input type="checkbox" id="anytimeCheck" class="form-checkbox h-4 w-4 text-blue-600 rounded">
                                <span>Anytime</span>
                            </label>
                        </div>
                    </div>
                </div>
                <button type="submit" id="searchBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-md transition duration-200 flex justify-center items-center">
                    <span id="btnText">Search the Web</span>
                    <i id="btnIcon" class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </form>
        </div>

        <!-- Dynamic Controls & Results Section -->
        <div id="resultsContainer" class="hidden">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-gray-800 mb-3 md:mb-0">Search Results</h3>
                
                <!-- Sort & Filter UI -->
                <div id="controlsContainer" class="hidden flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-4 bg-gray-200 p-2 rounded-md">
                    <div class="flex items-center">
                        <label class="text-sm font-semibold text-gray-700 mr-2">Region:</label>
                        <select id="regionFilter" class="border-gray-300 rounded text-sm p-1 outline-none">
                            <option value="All">All Regions</option>
                        </select>
                    </div>
                    <div class="flex items-center">
                        <label class="text-sm font-semibold text-gray-700 mr-2">Sort by Date:</label>
                        <select id="dateSort" class="border-gray-300 rounded text-sm p-1 outline-none">
                            <option value="none">Default</option>
                            <option value="asc">Earliest First</option>
                            <option value="desc">Latest First</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Error Banner -->
            <div id="errorBanner" class="hidden p-4 mb-4 bg-red-100 text-red-700 border border-red-200 rounded-md"></div>
            
            <!-- Cards Container -->
            <div id="resultsContent" class="space-y-4">
                <!-- Javascript will inject beautiful HTML cards here -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-300 py-8 mt-12">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
            <!-- Creator & Info -->
            <div class="text-center md:text-left">
                <h4 class="text-lg font-bold text-white mb-2">ScholarScout</h4>
                <p class="text-sm mb-2">Created by: <strong>Uthpala Kaushalya</strong></p>
                <p class="text-xs text-gray-400 mb-3">
                    <strong>Disclaimer:</strong> Always verify deadlines and funding on official institution websites.
                </p>
                <a href="history.html" class="text-sm text-blue-400 hover:text-blue-300 underline"><i class="fa-solid fa-clock-rotate-left mr-1"></i>View Version History</a>
            </div>

            <!-- Perfectly Aligned Counters -->
            <div class="flex justify-center md:justify-end space-x-6">
                <div class="flex flex-col items-center">
                    <span class="text-xs uppercase tracking-wider text-gray-400 mb-1">Page Visits</span>
                    <img src="https://visitor-badge.laobi.icu/badge?page_id=scholarscout.main" alt="Visitor Badge" class="h-5">
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-xs uppercase tracking-wider text-gray-400 mb-1">Searches</span>
                    <img src="https://visitor-badge.laobi.icu/badge?page_id=scholarscout.searches" alt="Searches Badge" id="searchCounterImg" class="h-5">
                </div>
            </div>
        </div>
    </footer>

    <script>
        let globalOpportunities = []; // Holds the JSON array of results

        // Date Toggle
        const anytimeCheck = document.getElementById('anytimeCheck');
        const dateInput = document.getElementById('startDate');
        anytimeCheck.addEventListener('change', (e) => {
            dateInput.disabled = e.target.checked;
            if(e.target.checked) dateInput.value = '';
        });

        // Search Submission
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const searchBtn = document.getElementById('searchBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            const errorBanner = document.getElementById('errorBanner');
            const resultsContent = document.getElementById('resultsContent');
            const controlsContainer = document.getElementById('controlsContainer');

            // Reset UI
            errorBanner.classList.add('hidden');
            resultsContent.innerHTML = '';
            controlsContainer.classList.add('hidden');
            btnText.innerText = "Scouting the web...";
            btnIcon.className = "fa-solid fa-circle-notch fa-spin ml-2";
            searchBtn.disabled = true;

            const keywords = document.getElementById('keywords').value;
            const level = document.getElementById('level').value;
            const location = document.getElementById('location').value;
            const date = anytimeCheck.checked ? "Anytime" : document.getElementById('startDate').value;

            // Updated Prompt to enforce strict JSON array output for speed and organization
            const prompt = `Search the web for 3 fully funded academic opportunities matching:
            Keywords: ${keywords} | Level: ${level} | Location: ${location} | Start Date: ${date}.
            
            Respond ONLY with a raw, valid JSON array of 3 objects. Do not wrap it in markdown blockquotes like \`\`\`json. 
            Each object MUST have these exact keys:
            "title" (Opportunity Name),
            "institution" (Institution and Country),
            "funding" (Funding Status Details),
            "stipend" (Stipend/Benefits estimates),
            "deadline" (Application Deadline - use YYYY-MM-DD format if possible),
            "startDate" (Expected start date - use YYYY-MM-DD or 'Anytime'),
            "region" (Name of Continent/Region, e.g., Europe, Asia),
            "international" (Yes/No),
            "contact" (Professor name or Email),
            "keywords" (Brief keyword tags),
            "link" (Real URL to apply or department portal).`;

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const rawText = await response.text();
                let data;

                // Handle Cloudflare 524 Error gracefully
                try {
                    data = JSON.parse(rawText);
                } catch (parseError) {
                    if (rawText.includes('524') || response.status === 524) {
                        throw new Error("The AI timed out (Cloudflare 524). Please try fewer keywords to speed up the search.");
                    } else {
                        throw new Error("The AI returned unreadable data. Please click search again.");
                    }
                }

                if (data.error) throw new Error(`Google API Error: ${data.error.message}`);
                
                // Clean markdown from AI's JSON if they accidentally included it
                let aiResponse = data.candidates[0].content.parts[0].text;
                aiResponse = aiResponse.replace(/```json/gi, '').replace(/```/g, '').trim();
                
                globalOpportunities = JSON.parse(aiResponse);
                
                // Show UI controls and render initial cards
                populateRegions();
                renderResults();
                resultsContainer.classList.remove('hidden');
                controlsContainer.classList.remove('hidden');

                // Update search counter
                document.getElementById('searchCounterImg').src = "https://visitor-badge.laobi.icu/badge?page_id=scholarscout.searches&time=" + new Date().getTime();

            } catch (error) {
                errorBanner.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i><strong>Error:</strong> ${error.message}`;
                errorBanner.classList.remove('hidden');
                resultsContainer.classList.remove('hidden');
            } finally {
                btnText.innerText = "Search the Web";
                btnIcon.className = "fa-solid fa-arrow-right ml-2";
                searchBtn.disabled = false;
            }
        });

        // Filter and Sort Logic
        const regionFilter = document.getElementById('regionFilter');
        const dateSort = document.getElementById('dateSort');

        regionFilter.addEventListener('change', renderResults);
        dateSort.addEventListener('change', renderResults);

        function populateRegions() {
            const regions = new Set(globalOpportunities.map(o => o.region).filter(Boolean));
            regionFilter.innerHTML = '<option value="All">All Regions</option>' + 
                Array.from(regions).map(r => `<option value="${r}">${r}</option>`).join('');
        }

        function renderResults() {
            const resultsContent = document.getElementById('resultsContent');
            let filtered = [...globalOpportunities];

            // Apply Region Filter
            if (regionFilter.value !== 'All') {
                filtered = filtered.filter(o => o.region === regionFilter.value);
            }

            // Apply Date Sorting
            if (dateSort.value === 'asc') {
                filtered.sort((a, b) => new Date(a.startDate || '2099-01-01') - new Date(b.startDate || '2099-01-01'));
            } else if (dateSort.value === 'desc') {
                filtered.sort((a, b) => new Date(b.startDate || '1970-01-01') - new Date(a.startDate || '1970-01-01'));
            }

            if (filtered.length === 0) {
                resultsContent.innerHTML = `<div class="p-4 bg-gray-100 text-gray-600 rounded">No opportunities match your current filter.</div>`;
                return;
            }

            // Generate Beautiful HTML Cards
            resultsContent.innerHTML = filtered.map(opp => `
                <div class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm hover:shadow-md transition-shadow">
                    <h4 class="text-xl font-bold text-blue-900 mb-2">
                        <a href="${opp.link}" target="_blank" rel="noopener noreferrer" class="text-blue-600 underline hover:text-blue-800 transition-colors flex items-center">
                            ${opp.title} <i class="fa-solid fa-arrow-up-right-from-square text-sm ml-2"></i>
                        </a>
                    </h4>
                    <p class="text-gray-700 font-semibold mb-4 border-b pb-2"><i class="fa-solid fa-building-columns text-gray-400 mr-2"></i>${opp.institution}</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm mb-4">
                        <p><strong class="text-gray-900">Funding:</strong> <span class="text-gray-700">${opp.funding}</span></p>
                        <p><strong class="text-gray-900">Stipend:</strong> <span class="text-green-700 font-medium">${opp.stipend}</span></p>
                        <p><strong class="text-gray-900">Deadline:</strong> <span class="text-red-600 font-medium">${opp.deadline}</span></p>
                        <p><strong class="text-gray-900">Start Date:</strong> <span class="text-gray-700">${opp.startDate}</span></p>
                        <p><strong class="text-gray-900">Region:</strong> <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs ml-1">${opp.region}</span></p>
                        <p><strong class="text-gray-900">International Allowed:</strong> <span class="text-gray-700">${opp.international}</span></p>
                    </div>
                    
                    <div class="bg-gray-50 p-3 rounded text-sm space-y-1">
                        <p><strong class="text-gray-900">Keywords:</strong> <span class="text-gray-600">${opp.keywords}</span></p>
                        <p><strong class="text-gray-900">Contact/Supervisor:</strong> <span class="text-gray-600">${opp.contact}</span></p>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
